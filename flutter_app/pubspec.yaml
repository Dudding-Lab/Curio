name: curio
description: Curio – Haushalts- und Mediensammlungs-App (Flutter + Supabase)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: any
  shared_preferences: ^2.5.3
  image_picker: 1.2.4
  drift: 2.32.1
  drift_flutter: 0.3.0
  uuid: 4.5.2
  flutter_secure_storage: 10.3.4
  local_auth: 2.3.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
