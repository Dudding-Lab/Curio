name: Kovunela web build

on:
  push:
    branches:
      - feature/kovunela-web-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select build-only configuration when web deployment is not configured
        id: configuration
        env:
          CONFIG_URL: ${{ vars.KOVUNELA_SUPABASE_URL }}
          CONFIG_KEY: ${{ vars.KOVUNELA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$CONFIG_URL" ] || [ -z "$CONFIG_KEY" ]; then
            echo "mode=compile-only" >> "$GITHUB_OUTPUT"
            echo "::warning::Web deployment configuration missing. Testing the Flutter web build with inert placeholders only."
          else
            echo "mode=configured" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap web platform in the existing Flutter app
        run: flutter create --platforms=web --project-name curio .
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Build existing Kovunela app for web
        env:
          SUPABASE_URL: ${{ vars.KOVUNELA_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.KOVUNELA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release \
            --dart-define="SUPABASE_URL=${SUPABASE_URL:-https://example.invalid}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_compile_only}"
      - name: Archive deployable web files
        if: steps.configuration.outputs.mode == 'configured'
        uses: actions/upload-artifact@v4
        with:
          name: kovunela-web
          path: flutter_app/build/web/
          if-no-files-found: error
          retention-days: 7
